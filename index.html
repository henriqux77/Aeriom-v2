<head>

  <meta name="theme-color" content="#0b0908">  <title>AERIOM — Mesa Virtual de RPG</title>  <!-- Tipografia -->  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >  <!-- Design System -->  <link rel="stylesheet" href="css/aeriom.css">
</head><body class="aeriom-page aeriom-page--auth">  <!--
    ============================================================
    AERIOM
    Página inicial / autenticação
    ============================================================

    Esta página não contém lógica de autenticação diretamente.

    Responsabilidades:
    - estrutura HTML;
    - acessibilidade;
    - estados visuais;
    - pontos de montagem para auth.js.

    A autenticação será feita pelo Supabase.
  -->  <main class="auth-shell"><!-- Painel visual -->
<section class="auth-visual" aria-hidden="true">

  <div class="auth-visual__overlay"></div>

  <div class="auth-visual__content">

    <div class="brand-mark">
      <span class="brand-mark__ornament">✦</span>

      <span class="brand-mark__name">
        AERIOM
      </span>

      <span class="brand-mark__subtitle">
        Mesa Virtual de RPG
      </span>
    </div>

    <div class="auth-quote">
      <p class="auth-quote__text">
        “Toda jornada começa antes da primeira rolagem.”
      </p>
    </div>

  </div>
</section>


<!-- Painel de autenticação -->
<section class="auth-panel">

  <div class="auth-panel__inner">

    <header class="auth-header">

      <div class="auth-header__mobile-brand">
        <span class="brand-mark__ornament">✦</span>

        <span class="brand-mark__name">
          AERIOM
        </span>
      </div>

      <h1 class="auth-header__title">
        Entre na mesa
      </h1>

      <p class="auth-header__description">
        Acesse sua conta para continuar sua campanha.
      </p>

    </header>


    <!-- Estado global de erro/sucesso -->
    <div
      id="auth-message"
      class="auth-message"
      role="alert"
      aria-live="polite"
      hidden
    ></div>


    <!-- Login -->
    <form
      id="login-form"
      class="auth-form"
      novalidate
    >

      <div class="form-field">

        <label
          class="form-field__label"
          for="login-email"
        >
          E-mail
        </label>

        <input
          id="login-email"
          class="form-field__input"
          name="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          placeholder="seu@email.com"
          maxlength="254"
          required
        >

        <span
          id="login-email-error"
          class="form-field__error"
          role="alert"
        ></span>

      </div>


      <div class="form-field">

        <div class="form-field__label-row">

          <label
            class="form-field__label"
            for="login-password"
          >
            Senha
          </label>

          <button
            id="forgot-password-button"
            class="auth-link auth-link--small"
            type="button"
          >
            Esqueci minha senha
          </button>

        </div>

        <div class="password-field">

          <input
            id="login-password"
            class="form-field__input"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Sua senha"
            maxlength="128"
            required
          >

          <button
            id="toggle-login-password"
            class="password-field__toggle"
            type="button"
            aria-label="Mostrar senha"
            aria-pressed="false"
          >
            Mostrar
          </button>

        </div>

        <span
          id="login-password-error"
          class="form-field__error"
          role="alert"
        ></span>

      </div>


      <button
        id="login-submit"
        class="button button--primary button--full"
        type="submit"
      >
        <span class="button__label">
          Entrar
        </span>

        <span
          class="button__loading"
          aria-hidden="true"
          hidden
        >
          Entrando...
        </span>
      </button>

    </form>


    <!-- Separador -->
    <div class="auth-divider">
      <span class="auth-divider__line"></span>
      <span class="auth-divider__text">ou</span>
      <span class="auth-divider__line"></span>
    </div>


    <!-- Cadastro -->
    <button
      id="show-register-button"
      class="button button--secondary button--full"
      type="button"
    >
      Criar uma conta
    </button>


    <!-- Cadastro escondido inicialmente -->
    <form
      id="register-form"
      class="auth-form"
      novalidate
      hidden
    >

      <div class="form-field">

        <label
          class="form-field__label"
          for="register-name"
        >
          Nome
        </label>

        <input
          id="register-name"
          class="form-field__input"
          name="displayName"
          type="text"
          autocomplete="name"
          placeholder="Como você será chamado?"
          maxlength="80"
          required
        >

        <span
          id="register-name-error"
          class="form-field__error"
          role="alert"
        ></span>

      </div>


      <div class="form-field">

        <label
          class="form-field__label"
          for="register-email"
        >
          E-mail
        </label>

        <input
          id="register-email"
          class="form-field__input"
          name="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          placeholder="seu@email.com"
          maxlength="254"
          required
        >

        <span
          id="register-email-error"
          class="form-field__error"
          role="alert"
        ></span>

      </div>


      <div class="form-field">

        <label
          class="form-field__label"
          for="register-password"
        >
          Senha
        </label>

        <div class="password-field">

          <input
            id="register-password"
            class="form-field__input"
            name="password"
            type="password"
            autocomplete="new-password"
            placeholder="Crie uma senha"
            maxlength="128"
            minlength="8"
            required
          >

          <button
            id="toggle-register-password"
            class="password-field__toggle"
            type="button"
            aria-label="Mostrar senha"
            aria-pressed="false"
          >
            Mostrar
          </button>

        </div>

        <span
          id="register-password-error"
          class="form-field__error"
          role="alert"
        ></span>

      </div>


      <button
        id="register-submit"
        class="button button--primary button--full"
        type="submit"
      >
        <span class="button__label">
          Criar conta
        </span>

        <span
          class="button__loading"
          aria-hidden="true"
          hidden
        >
          Criando...
        </span>
      </button>

    </form>


    <button
      id="show-login-button"
      class="auth-link auth-link--back"
      type="button"
      hidden
    >
      ← Voltar para login
    </button>


    <footer class="auth-footer">

      <p>
        AERIOM
        <span aria-hidden="true">•</span>
        Mesa Virtual de RPG
      </p>

      <p class="auth-footer__version">
        v2
      </p>

    </footer>

  </div>

</section>

  </main>  <!--
    ============================================================
    Scripts
    ============================================================

    O Supabase JS será carregado pelo módulo supabase.js.

    Os módulos abaixo serão adicionados na sequência da Fase 2.
  -->  <script
    type="module"
    src="js/core/supabase.js"
  ></script></body>
</html>
