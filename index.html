<head>

  <meta name="theme-color" content="#0b0908">  <title>AERIOM — Mesa Virtual de RPG</title>  <!-- ========================================================
       FONTES
       ======================================================== -->  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >  <!-- ========================================================
       DESIGN SYSTEM
       ======================================================== -->  <link
    rel="stylesheet"
    href="css/aeriom.css"
  >
</head><body class="aeriom-page aeriom-page--auth">  <!-- ========================================================
       AUTH SHELL
       ======================================================== -->  <main class="auth-shell"><!-- ======================================================
     PAINEL VISUAL / SLIDES
     ====================================================== -->

<section
  class="auth-visual"
  aria-label="Apresentação do AERIOM"
>

  <div
    id="auth-slide-background"
    class="auth-visual__background"
    aria-hidden="true"
  ></div>

  <div
    class="auth-visual__overlay"
    aria-hidden="true"
  ></div>

  <div class="auth-visual__content">

    <!-- Logo -->
    <a
      class="auth-brand"
      href="./index.html"
      aria-label="AERIOM — página inicial"
    >

      <img
        class="auth-brand__logo"
        src="https://i.ibb.co/Cfd1zhc/52befe11-27fa-490b-a434-8afa6fd3f5c1-20260823-192033-0000.png"
        alt="AERIOM"
      >

    </a>


    <!-- Texto do slide -->
    <div
      id="auth-slide-content"
      class="auth-slide-content"
    >

      <p
        id="auth-slide-eyebrow"
        class="auth-slide-content__eyebrow"
      >
        AERIOM
      </p>

      <h2
        id="auth-slide-title"
        class="auth-slide-content__title"
      >
        Sua aventura começa aqui
      </h2>

      <p
        id="auth-slide-description"
        class="auth-slide-content__description"
      >
        Reúna seu grupo, prepare suas fichas e entre na mesa.
      </p>

    </div>


    <!-- Indicadores dos slides -->
    <div
      id="auth-slide-indicators"
      class="auth-slide-indicators"
      aria-label="Slides da apresentação"
    ></div>

  </div>

</section>


<!-- ======================================================
     PAINEL DE AUTENTICAÇÃO
     ====================================================== -->

<section class="auth-panel">

  <div class="auth-panel__inner">

    <!-- ==================================================
         MARCA MOBILE
         ================================================== -->

    <header class="auth-header">

      <a
        class="auth-header__mobile-brand"
        href="./index.html"
        aria-label="AERIOM"
      >

        <img
          src="https://i.ibb.co/Cfd1zhc/52befe11-27fa-490b-a434-8afa6fd3f5c1-20260823-192033-0000.png"
          alt="AERIOM"
        >

      </a>


      <h1
        id="auth-title"
        class="auth-header__title"
      >
        Entre na mesa
      </h1>

      <p
        id="auth-description"
        class="auth-header__description"
      >
        Acesse sua conta para continuar sua campanha.
      </p>

    </header>


    <!-- ==================================================
         MENSAGEM GLOBAL
         ================================================== -->

    <div
      id="auth-message"
      class="auth-message"
      role="alert"
      aria-live="polite"
      hidden
    ></div>


    <!-- ==================================================
         LOGIN
         ================================================== -->

    <form
      id="login-form"
      class="auth-form"
      novalidate
    >

      <!-- E-mail -->

      <div class="form-field">

        <label
          class="form-field__label"
          for="login-email"
        >
          E-mail
        </label>

        <input
          id="login-email"
          class="form-field__input"
          name="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          placeholder="seu@email.com"
          maxlength="254"
          required
        >

        <span
          id="login-email-error"
          class="form-field__error"
          role="alert"
        ></span>

      </div>


      <!-- Senha -->

      <div class="form-field">

        <div class="form-field__label-row">

          <label
            class="form-field__label"
            for="login-password"
          >
            Senha
          </label>

          <button
            id="forgot-password-button"
            class="auth-link auth-link--small"
            type="button"
          >
            Esqueci minha senha
          </button>

        </div>


        <div class="password-field">

          <input
            id="login-password"
            class="form-field__input"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Sua senha"
            maxlength="128"
            required
          >

          <button
            id="toggle-login-password"
            class="password-field__toggle"
            type="button"
            aria-label="Mostrar senha"
            aria-pressed="false"
          >
            Mostrar
          </button>

        </div>

        <span
          id="login-password-error"
          class="form-field__error"
          role="alert"
        ></span>

      </div>


      <!-- Entrar -->

      <button
        id="login-submit"
        class="button button--primary button--full"
        type="submit"
      >

        <span class="button__label">
          Entrar
        </span>

        <span
          class="button__loading"
          aria-hidden="true"
          hidden
        >
          Entrando...
        </span>

      </button>

    </form>


    <!-- ==================================================
         DISCORD
         ================================================== -->

    <div class="auth-divider">

      <span class="auth-divider__line"></span>

      <span class="auth-divider__text">
        ou
      </span>

      <span class="auth-divider__line"></span>

    </div>


    <button
      id="discord-login-button"
      class="button button--discord button--full"
      type="button"
    >

      <span
        class="button__icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="currentColor"
        >
          <path d="M19.54 5.36A16.7 16.7 0 0 0 15.96 4.2l-.44.9a15.2 15.2 0 0 0-7.04 0l-.44-.9a16.75 16.75 0 0 0-3.58 1.16C2.2 8.84 1.58 12.24 1.88 15.6a16.6 16.6 0 0 0 4.4 2.24l1.07-1.46a10.6 10.6 0 0 1-1.68-.8l.4-.3c3.24 1.5 7.1 1.5 10.3 0l.4.3c-.53.3-1.09.57-1.68.8l1.07 1.46a16.6 16.6 0 0 0 4.4-2.24c.35-3.9-.6-7.27-1.04-10.24ZM8.53 14.08c-.97 0-1.77-.9-1.77-2s.78-2 1.77-2c.99 0 1.79.9 1.78 2 0 1.1-.79 2-1.78 2Zm6.94 0c-.97 0-1.77-.9-1.77-2s.78-2 1.77-2c.99 0 1.79.9 1.78 2 0 1.1-.79 2-1.78 2Z"/>
        </svg>
      </span>

      <span class="button__label">
        Entrar com Discord
      </span>

      <span
        class="button__loading"
        aria-hidden="true"
        hidden
      >
        Conectando...
      </span>

    </button>


    <!-- ==================================================
         CADASTRO
         ================================================== -->

    <button
      id="show-register-button"
      class="button button--secondary button--full"
      type="button"
    >
      Criar uma conta
    </button>


    <!-- ==================================================
         FORMULÁRIO DE CADASTRO
         ================================================== -->

    <form
      id="register-form"
      class="auth-form"
      novalidate
      hidden
    >

      <!-- Nome -->

      <div class="form-field">

        <label
          class="form-field__label"
          for="register-name"
        >
          Nome
        </label>

        <input
          id="register-name"
          class="form-field__input"
          name="displayName"
          type="text"
          autocomplete="name"
          placeholder="Como você será chamado?"
          maxlength="80"
          required
        >

        <span
          id="register-name-error"
          class="form-field__error"
          role="alert"
        ></span>

      </div>


      <!-- E-mail -->

      <div class="form-field">

        <label
          class="form-field__label"
          for="register-email"
        >
          E-mail
        </label>

        <input
          id="register-email"
          class="form-field__input"
          name="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          placeholder="seu@email.com"
          maxlength="254"
          required
        >

        <span
          id="register-email-error"
          class="form-field__error"
          role="alert"
        ></span>

      </div>


      <!-- Senha -->

      <div class="form-field">

        <label
          class="form-field__label"
          for="register-password"
        >
          Senha
        </label>

        <div class="password-field">

          <input
            id="register-password"
            class="form-field__input"
            name="password"
            type="password"
            autocomplete="new-password"
            placeholder="Crie sua senha"
            minlength="8"
            maxlength="128"
            required
          >

          <button
            id="toggle-register-password"
            class="password-field__toggle"
            type="button"
            aria-label="Mostrar senha"
            aria-pressed="false"
          >
            Mostrar
          </button>

        </div>

        <span
          id="register-password-error"
          class="form-field__error"
          role="alert"
        ></span>

      </div>


      <!-- Confirmar senha -->

      <div class="form-field">

        <label
          class="form-field__label"
          for="register-password-confirm"
        >
          Confirmar senha
        </label>

        <div class="password-field">

          <input
            id="register-password-confirm"
            class="form-field__input"
            name="passwordConfirm"
            type="password"
            autocomplete="new-password"
            placeholder="Digite a senha novamente"
            minlength="8"
            maxlength="128"
            required
          >

          <button
            id="toggle-register-password-confirm"
            class="password-field__toggle"
            type="button"
            aria-label="Mostrar confirmação da senha"
            aria-pressed="false"
          >
            Mostrar
          </button>

        </div>

        <span
          id="register-password-confirm-error"
          class="form-field__error"
          role="alert"
        ></span>

      </div>


      <!-- Criar conta -->

      <button
        id="register-submit"
        class="button button--primary button--full"
        type="submit"
      >

        <span class="button__label">
          Criar conta
        </span>

        <span
          class="button__loading"
          aria-hidden="true"
          hidden
        >
          Criando conta...
        </span>

      </button>

    </form>


    <!-- Voltar -->

    <button
      id="show-login-button"
      class="auth-link auth-link--back"
      type="button"
      hidden
    >
      ← Voltar para login
    </button>


    <!-- ==================================================
         RODAPÉ
         ================================================== -->

    <footer class="auth-footer">

      <p>
        AERIOM
        <span aria-hidden="true">•</span>
        Mesa Virtual de RPG
      </p>

      <p class="auth-footer__version">
        v2
      </p>

    </footer>

  </div>

</section>

  </main>  <!-- ========================================================
       TOAST REGION
       ======================================================== -->  <div
    id="aeriom-toast-region"
    class="aeriom-toast-region"
    aria-live="polite"
    aria-atomic="true"
  ></div>  <!-- ========================================================
       APPLICATION
       ======================================================== -->  <script
  type="module"
  src="./js/core/main.js"
></script></body>
</html>
