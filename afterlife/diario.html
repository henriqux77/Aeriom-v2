<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050807">
<title>AFTERLIFE — Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/afterlife.css?v=20260920"><link rel="stylesheet" href="./css/afterlife-sidebar.css?v=20260920">
<style>
.diary-page{padding:28px;max-width:1180px;margin:0 auto}.diary-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.diary-head h1{margin:4px 0 6px;font:700 34px Cinzel,serif}.diary-head p{margin:0;color:#819087;max-width:680px}.diary-status{color:#9fb0a6;font-size:12px}.diary-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.diary-toolbar a,.diary-toolbar button{padding:9px 13px;border:1px solid rgba(127,160,145,.18);border-radius:10px;color:#dbe5df;text-decoration:none;background:rgba(255,255,255,.02);cursor:pointer}.diary-toolbar button{display:none}.diary-feed{display:grid;gap:11px}.diary-card{display:grid;grid-template-columns:86px minmax(0,1fr);gap:16px;padding:18px;border:1px solid rgba(127,160,145,.16);border-radius:16px;background:linear-gradient(180deg,rgba(15,25,21,.96),rgba(7,14,11,.94))}.diary-time{color:#7f9a8b;font-size:12px}.diary-main strong{display:block;color:#eef4f0;font-size:17px}.diary-main p{margin:8px 0 0;color:#aebbb4;line-height:1.55}.diary-type{display:inline-block;margin-top:9px;padding:4px 7px;border:1px solid rgba(57,245,138,.14);border-radius:999px;color:#8ef0b4;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.empty{padding:44px;text-align:center;border:1px dashed rgba(127,160,145,.18);border-radius:16px;color:#829088}.dialog-backdrop{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.72);z-index:9999}.dialog{width:min(620px,100%);padding:20px;border:1px solid rgba(127,160,145,.18);border-radius:18px;background:#0a100d;box-shadow:0 24px 80px rgba(0,0,0,.5)}.dialog h2{margin:0 0 14px;font-family:Cinzel,serif}.dialog form{display:grid;gap:12px}.dialog label{display:grid;gap:6px;color:#99aaa1;font-size:12px}.dialog input,.dialog textarea,.dialog select{width:100%;padding:11px 12px;border:1px solid rgba(127,160,145,.18);border-radius:10px;background:#060b08;color:#edf4ef;box-sizing:border-box}.dialog-actions{display:flex;justify-content:flex-end;gap:9px}.dialog-actions button{padding:10px 14px;border-radius:10px;border:1px solid rgba(127,160,145,.2);background:transparent;color:#dce6e0;cursor:pointer}.dialog-actions button.primary{border-color:rgba(57,245,138,.3);background:#27d475;color:#041008}@media(max-width:700px){.diary-page{padding:18px 14px}.diary-head{align-items:start;flex-direction:column}.diary-head h1{font-size:28px}.diary-card{grid-template-columns:1fr;gap:6px}}
</style></head>
<body class="aeriom-page"><div class="app-shell">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="brand__title"><span>A</span>FTERLIFE</div></div>
<nav class="side-nav" aria-label="Navegação Afterlife">
<a class="side-nav__item" href="./index.html"><span class="icon">⌂</span><span>Início</span></a><a class="side-nav__item" href="./campanhas.html"><span class="icon">◈</span><span>Campanhas</span></a><a class="side-nav__item" href="./personagens.html"><span class="icon">●</span><span>Personagens</span></a><a class="side-nav__item" href="./mapa-mundial.html"><span class="icon">◇</span><span>Mapa Mundial</span></a><a class="side-nav__item" href="./inventario.html"><span class="icon">▣</span><span>Inventário</span></a><a class="side-nav__item is-active" href="./diario.html"><span class="icon">▤</span><span>Diário</span></a>
</nav><div class="sidebar-spacer"></div><a class="side-nav__item" href="./perfil.html"><span class="icon">⚙</span><span>Configurações</span></a></aside>
<main class="main"><header class="topbar"><button class="mobile-menu" id="mobileMenu" type="button" aria-label="Abrir menu">☰</button></header>
<section class="diary-page"><header class="diary-head"><div><div class="eyebrow">AFTERLIFE · MEMÓRIA DA CAMPANHA</div><h1>Diário</h1><p id="campaignLabel">Carregando campanha…</p></div><span class="diary-status" id="diaryStatus">Sincronizando…</span></header>
<div class="diary-toolbar"><a id="backCampaign" href="./campanhas.html">← Campanhas</a><a id="backMap" href="./mapa-mundial.html">◇ Mapa</a><button id="newEntry">＋ Registrar acontecimento</button></div><div class="diary-feed" id="diaryFeed"><div class="empty">Carregando diário…</div></div></section></main></div>
<script type="module">
import './js/error-monitor.js?v=20260920';import './js/afterlife-sidebar.js?v=20260920';import {aeriom,ensureAfterlifeSession} from './js/aeriom-client-v2.js?v=20260920';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),feed=document.getElementById('diaryFeed'),status=document.getElementById('diaryStatus'),label=document.getElementById('campaignLabel'),qs=new URLSearchParams(location.search);
let campaignId=qs.get('campaign')||qs.get('id')||sessionStorage.getItem('afterlife_current_campaign_id')||'',role='player',timer=null;
function render(rows){if(!rows.length){feed.innerHTML='<div class="empty"><strong>Nenhum acontecimento registrado</strong><br>A história da mesa aparecerá aqui.</div>';return;}feed.innerHTML=rows.map(e=>'<article class="diary-card"><div class="diary-time">'+new Date(e.occurred_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+'</div><div class="diary-main"><strong>'+esc(e.title)+'</strong><p>'+esc(e.body||'')+'</p><span class="diary-type">'+esc(e.event_type||'registro')+'</span></div></article>').join('');}
async function load(){const r=await aeriom.rpc('list_campaign_visible_diary_entries',{p_campaign_id:campaignId});if(r.error)throw r.error;const rows=Array.isArray(r.data)?r.data:[];render(rows);status.textContent=rows.length+' registros · atualizado agora';}
async function openEditor(){if(role!=='master')return;const root=document.createElement('div');root.className='dialog-backdrop';root.innerHTML='<section class="dialog" role="dialog" aria-modal="true"><h2>Registrar acontecimento</h2><form><label>Título<input name="title" maxlength="180" required></label><label>Descrição<textarea name="body" rows="6" maxlength="5000"></textarea></label><label>Tipo<select name="event_type"><option value="action">Ação</option><option value="combat">Combate</option><option value="system">Sistema</option><option value="note">Nota</option></select></label><div class="dialog-actions"><button type="button" data-cancel>Cancelar</button><button class="primary" type="submit">Registrar</button></div></form></section>';document.body.appendChild(root);root.querySelector('[data-cancel]').onclick=()=>root.remove();root.addEventListener('click',e=>{if(e.target===root)root.remove()});root.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;try{const r=await aeriom.rpc('append_campaign_diary_entry',{p_campaign_id:campaignId,p_title:f.title.value.trim(),p_body:f.body.value.trim(),p_event_type:f.event_type.value});if(r.error)throw r.error;root.remove();await load();}catch(error){console.error('[AFTERLIFE][DIARY][WRITE]',error);alert(error?.message||'Não foi possível registrar o acontecimento.');}};}
async function boot(){const session=await ensureAfterlifeSession();if(!session?.user){location.href='../index.html';return;}if(!campaignId){status.textContent='Campanha não informada';feed.innerHTML='<div class="empty">Abra o diário a partir de uma campanha.</div>';return;}sessionStorage.setItem('afterlife_current_campaign_id',campaignId);const c=await aeriom.from('campaigns').select('id,name').eq('id',campaignId).maybeSingle();if(c.error)throw c.error;if(!c.data)throw new Error('Campanha não encontrada.');label.textContent=c.data.name;document.getElementById('backCampaign').href='./campanha.html?campaign='+encodeURIComponent(c.data.id);document.getElementById('backMap').href='./mapa-mundial.html?campaign='+encodeURIComponent(c.data.id);const m=await aeriom.from('campaign_members').select('role').eq('campaign_id',campaignId).eq('user_id',(await ensureAfterlifeSession()).user.id).maybeSingle();if(m.error)throw m.error;if(!m.data)throw new Error('Você não participa desta campanha.');role=m.data.role==='master'?'master':'player';document.getElementById('newEntry').style.display=role==='master'?'inline-block':'none';document.getElementById('newEntry').onclick=openEditor;await load();timer=setInterval(()=>load().catch(e=>console.warn('[AFTERLIFE][DIARY][POLL]',e)),30000);addEventListener('pagehide',()=>{if(timer)clearInterval(timer)},{once:true});}
boot().catch(e=>{console.error('[AFTERLIFE][DIARY][BOOT]',e);status.textContent=e?.message||'Erro ao carregar';});
</script></body></html>
