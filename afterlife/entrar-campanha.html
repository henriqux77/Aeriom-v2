<style>
body{min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,rgba(57,245,138,.09),transparent 34%),#050807;color:#edf5f0;font-family:Inter,system-ui,sans-serif;padding:18px}.join-shell{width:min(520px,100%);border:1px solid rgba(127,160,145,.18);border-radius:22px;background:linear-gradient(180deg,#0b1711,#060c09);box-shadow:0 35px 90px rgba(0,0,0,.5);overflow:hidden}.join-head{padding:28px 24px 18px;border-bottom:1px solid rgba(255,255,255,.06);text-align:center}.join-head img{width:min(230px,75%);display:block;margin:0 auto 18px}.join-eyebrow{color:#39f58a;font-size:10px;font-weight:900;letter-spacing:2px}.join-head h1{margin:10px 0 8px;font-size:27px}.join-head p{margin:0;color:#85938c;font-size:12px;line-height:1.6}.join-body{padding:22px;display:grid;gap:14px}.join-label{display:grid;gap:8px;color:#aebbb4;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.join-input{height:58px;border:1px solid rgba(255,255,255,.1);border-radius:13px;background:#050907;color:#eef6f0;text-align:center;font:900 25px Inter;letter-spacing:9px;text-transform:uppercase;outline:none}.join-input:focus{border-color:rgba(57,245,138,.48);box-shadow:0 0 0 4px rgba(57,245,138,.06)}.join-submit{min-height:48px;border:1px solid rgba(57,245,138,.42);border-radius:11px;background:linear-gradient(180deg,#4cf99a,#26d777);color:#041008;font:900 11px Inter;cursor:pointer}.join-message{min-height:20px;text-align:center;color:#8f9d96;font-size:10px}.join-message.error{color:#ffaaa2}.join-message.success{color:#69f8a7}.join-foot{display:flex;justify-content:center;padding:0 22px 22px}.join-foot a{color:#77867e;font-size:10px;text-decoration:none}.join-foot a:hover{color:#39f58a}
</style>
</head>
<body>
<main class="join-shell">
<header class="join-head"><img src="https://i.ibb.co/BH2Hqr3P/file-00000000b47c820e88b788de23f77e3e.png" alt="AFTERLIFE"><div class="join-eyebrow">AFTERLIFE · CONVITE DE CAMPANHA</div><h1>Entre na campanha</h1><p>Use o código de 5 caracteres enviado pelo Mestre. O convite expira automaticamente após 5 minutos.</p></header>

<footer class="join-foot"><a href="./campanhas.html">Voltar para campanhas</a></footer>
</main>
