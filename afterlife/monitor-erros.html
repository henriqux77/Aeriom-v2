<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AFTERLIFE — Monitor de Erros</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/afterlife.css?v=20260914-31">
<style>
:root{--bg:#050807;--panel:#0a1510;--line:rgba(127,160,145,.18);--text:#edf5ef;--muted:#82918a;--green:#39f58a;--red:#ff6670;--amber:#f4cf72}
body{background:radial-gradient(circle at 80% 0%,rgba(57,245,138,.08),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;margin:0}.monitor{max-width:1180px;margin:auto;padding:32px 20px 70px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.eyebrow{letter-spacing:.18em;font-size:11px;color:var(--green);font-weight:800}.head h1{font-size:clamp(34px,6vw,64px);margin:8px 0}.head p{color:var(--muted);max-width:700px;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#0b120f;color:var(--text);border-radius:12px;padding:12px 15px;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(180deg,#49ff9a,#27d475);color:#031008;border-color:rgba(57,245,138,.45)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat,.log{background:rgba(10,21,16,.92);border:1px solid var(--line);border-radius:18px}.stat{padding:18px}.stat b{font-size:30px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.log{padding:0;overflow:hidden}.log-head,.row{display:grid;grid-template-columns:170px 150px 80px 1fr;gap:12px;padding:14px 16px;align-items:start}.log-head{color:var(--muted);font-size:11px;letter-spacing:.12em;font-weight:800;border-bottom:1px solid var(--line)}.row{border-bottom:1px solid rgba(127,160,145,.1);font-size:13px}.row:last-child{border-bottom:0}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800;text-transform:uppercase}.badge.http,.badge.javascript,.badge.console-error,.badge.network,.badge.unhandledrejection{background:rgba(255,102,112,.12);color:var(--red)}.badge.console-warn{background:rgba(244,207,114,.12);color:var(--amber)}.empty{padding:44px 20px;text-align:center;color:var(--muted)}.detail{color:var(--muted);overflow-wrap:anywhere}.detail strong{color:var(--text)}@media(max-width:760px){.head{display:block}.actions{margin-top:15px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.log-head{display:none}.row{grid-template-columns:1fr 1fr;gap:8px}.row>*:last-child{grid-column:1/-1}.monitor{padding:22px 14px 50px}}
</style>
</head><body><main class="monitor"><header class="head"><div><div class="eyebrow">AFTERLIFE · DIAGNÓSTICO</div><h1>Monitor de erros</h1><p>Registra erros JavaScript, rejeições de Promise, falhas de rede e respostas HTTP 4xx/5xx para descobrir exatamente onde uma página está quebrando.</p></div><div class="actions"><button class="btn" id="back">← AFTERLIFE</button><button class="btn" id="clear">LIMPAR LOG</button><button class="btn primary" id="export">EXPORTAR JSON</button></div></header><section class="stats"><div class="stat"><b id="total">0</b><span>TOTAL</span></div><div class="stat"><b id="js">0</b><span>JAVASCRIPT</span></div><div class="stat"><b id="http">0</b><span>HTTP</span></div><div class="stat"><b id="network">0</b><span>REDE</span></div></section><section class="log"><div class="log-head"><div>HORÁRIO</div><div>TIPO</div><div>STATUS</div><div>DETALHE</div></div><div id="rows"></div></section></main><script src="./js/error-monitor.js?v=20260914-1"></script><script type="module">
import './js/error-monitor.js?v=20260914-1';
const monitor=window.AFTERLIFE_ERROR_MONITOR; const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function render(){const logs=monitor?.logs||[];$('total').textContent=logs.length;$('js').textContent=logs.filter(x=>x.type==='javascript'||x.type==='unhandledrejection').length;$('http').textContent=logs.filter(x=>x.type==='http').length;$('network').textContent=logs.filter(x=>x.type==='network').length;const rows=$('rows');rows.replaceChildren();if(!logs.length){rows.innerHTML='<div class="empty">Nenhum erro registrado neste dispositivo.</div>';return;}logs.slice().reverse().forEach(x=>{const row=document.createElement('div');row.className='row';const detail=[x.message,x.url,x.filename?`${x.filename}:${x.line||''}:${x.column||''}`:''].filter(Boolean).join(' · ');row.innerHTML=`<div>${esc(new Date(x.timestamp).toLocaleString('pt-BR'))}</div><div><span class="badge ${esc(x.type)}">${esc(x.type)}</span></div><div>${esc(x.status||'—')}</div><div class="detail"><strong>${esc(detail||'Sem detalhe')}</strong><br>${esc(x.page||'')}</div>`;rows.appendChild(row);});}
$('back').onclick=()=>location.href='./index.html';$('clear').onclick=()=>{monitor?.clear();render()};$('export').onclick=()=>{const blob=new Blob([monitor?.export()||'[]'],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`afterlife-errors-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url)};window.addEventListener('afterlife:error-recorded',render);render();
</script></body></html>
